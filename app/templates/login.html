<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <title>Login — Translation Service</title>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/index"><i class="bi bi-translate"></i>Translation Service</a>
        </div>
    </nav>

    <div class="content">
        <div class="card card-sm">
            <h2><i class="bi bi-box-arrow-in-right me-2"></i>Login</h2>
            <p class="subtitle">Sign in to save and view your translation history.</p>

            <div id="alert" class="alert alert-danger" role="alert"></div>

            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" class="form-control" type="text" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" class="form-control" type="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="/register">Sign up</a></small>
            </div>
        </div>
    </div>

    <div class="footer">&copy; 2026 Translation Service</div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alert = document.getElementById('alert');
            alert.className = 'alert alert-danger';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) {
                    let msg = 'Login failed';
                    try { const d = await res.json(); if (d.detail) msg = d.detail; } catch(_){}
                    alert.textContent = msg;
                    alert.className = 'alert alert-danger show';
                    return false;
                }
                window.location.href = '/index';
            } catch (err) {
                alert.textContent = 'Network error. Please try again.';
                alert.className = 'alert alert-danger show';
            }
            return false;
        }
    </script>
</body>
</html>
